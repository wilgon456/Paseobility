name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  posix:
    name: macOS (bash + Python + Node suites)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Plugin dependencies
        run: npm ci --prefix plugin

      - name: Plugin types and launch safety
        run: |
          npm --prefix plugin run typecheck
          npm --prefix plugin test

      - name: Validation dependency (CI only)
        run: python -m pip install PyYAML==6.0.3

      - name: Bash syntax check
        run: |
          for f in scripts/*.sh skills/*/scripts/*.sh; do
            bash -n "$f"
          done

      - name: Offline Python suites
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Paseo Multi offline adapter suite
        run: python skills/paseo-multi/scripts/test_hosts.py

      - name: Paseo Multi adapter syntax
        run: node --check skills/paseo-multi/scripts/rpc.mjs

      - name: Catalog and skill frontmatter
        run: python scripts/validate-skills.py

      - name: Verify pinned Toss Harness resources
        run: python skills/paseo-toss/scripts/verify.py

      - name: Test Toss bundle integrity
        run: python -B skills/paseo-toss/scripts/test_verify.py

      - name: Vendored design data
        run: python skills/paseo-design/vendor/ui-ux-pro-max/scripts/validate_data.py

      - name: Vendored design runtime tests
        run: python -m unittest discover -s skills/paseo-design/vendor/ui-ux-pro-max/scripts/tests -p "test_*.py"

      - name: Cleanup complete-snapshot adapter
        run: node --test skills/paseo-agent-cleanup/scripts/snapshot.test.mjs

      - name: Node cleanup suite
        run: node skills/paseo-agent-cleanup/scripts/agent-cleanup.test.js

      - name: God run records
        run: node --test skills/paseo-god/scripts/god-run.test.mjs

      - name: Existing Chrome tab lifecycle
        run: python -B -m unittest discover -s skills/paseo-browser/scripts -p "test_*.py" -v

      - name: Browser leftover sweep
        run: node --test skills/paseo-browser/scripts/browser-sweep.test.mjs

      - name: Node share suite
        run: node skills/paseo-share/scripts/paseo-share.test.js

      # Shared discovery runs the repeated, isolated scanner-helper fixtures.
      # No optional scanner from the runner's PATH may enter a fixture run.
      - name: Scanner classification suite
        run: python skills/paseo-spyware-check/scripts/spyware-check.test.py

      - name: design-check selftest (headless Chrome)
        env:
          DESIGN_CHECK_REQUIRE_BROWSER: "1"
        run: node skills/paseo-design/scripts/design-check.mjs --selftest

  windows:
    name: Windows (PowerShell + shared Python + Node)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validation dependency (CI only)
        run: python -m pip install PyYAML==6.0.3

      - name: PowerShell syntax check (pwsh and Windows PowerShell)
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts, tests, skills -Filter *.ps1 -Recurse | ForEach-Object {
            $file = $_.FullName
            try {
              $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath $file))
            } catch {
              Write-Host "syntax error in $file"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: PowerShell 5.1 syntax check
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path scripts, tests, skills -Filter *.ps1 -Recurse | ForEach-Object {
            $file = $_.FullName
            try {
              $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath $file))
            } catch {
              Write-Host "syntax error in $file"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # One discover run covers every shared, cross-platform Python test; the
      # POSIX-only cases self-skip on Windows. A single command cannot mask a
      # first-command failure the way two commands in one block can.
      - name: Shared Python suites (cross-platform)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Paseo Multi offline adapter suite
        run: python skills/paseo-multi/scripts/test_hosts.py

      - name: Paseo Multi adapter syntax
        run: node --check skills/paseo-multi/scripts/rpc.mjs

      - name: Catalog and skill frontmatter
        run: python scripts/validate-skills.py

      - name: Verify pinned Toss Harness resources
        run: python skills/paseo-toss/scripts/verify.py

      - name: Test Toss bundle integrity
        run: python -B skills/paseo-toss/scripts/test_verify.py

      - name: Vendored design data
        run: python skills/paseo-design/vendor/ui-ux-pro-max/scripts/validate_data.py

      - name: Vendored design runtime tests
        run: python -m unittest discover -s skills/paseo-design/vendor/ui-ux-pro-max/scripts/tests -p "test_*.py"

      - name: Cleanup complete-snapshot adapter
        run: node --test skills/paseo-agent-cleanup/scripts/snapshot.test.mjs

      - name: Node cleanup suite
        run: node skills/paseo-agent-cleanup/scripts/agent-cleanup.test.js

      - name: God run records
        run: node --test skills/paseo-god/scripts/god-run.test.mjs

      - name: Existing Chrome tab lifecycle
        run: python -B -m unittest discover -s skills/paseo-browser/scripts -p "test_*.py" -v

      - name: Browser leftover sweep
        run: node --test skills/paseo-browser/scripts/browser-sweep.test.mjs

      - name: Node share suite
        run: node skills/paseo-share/scripts/paseo-share.test.js

      - name: Scanner suite (cross-platform)
        run: python skills/paseo-spyware-check/scripts/spyware-check.test.py

      - name: design-check selftest (headless Chrome)
        env:
          DESIGN_CHECK_REQUIRE_BROWSER: "1"
        run: node skills/paseo-design/scripts/design-check.mjs --selftest

      - name: Windows Cua installer runtime tests (pwsh)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/test_cua_driver_runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows Cua installer runtime tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_cua_driver_runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
